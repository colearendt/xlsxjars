# Workflow to build R package tarball for CRAN submission
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

name: build-package

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build package
        run: |
          # Build the package tarball
          pkg_tarball <- pkgbuild::build(dest_path = ".")
          cat("Package built:", pkg_tarball, "\n")
          
          # Get package info for artifact naming
          desc <- read.dcf("DESCRIPTION")
          pkg_name <- desc[,"Package"]
          pkg_version <- desc[,"Version"]
          
          # Write info to environment for next steps
          cat("PKG_NAME=", pkg_name, "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
          cat("PKG_VERSION=", pkg_version, "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
          cat("PKG_TARBALL=", basename(pkg_tarball), "\n", file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
        shell: Rscript {0}

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ env.PKG_VERSION }}.tar.gz
          path: ${{ env.PKG_TARBALL }}
          retention-days: 30

      - name: Quick check of built package
        run: |
          # Verify the tarball can be checked
          R CMD check --no-manual --no-vignettes ${{ env.PKG_TARBALL }}
        shell: bash